<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কসমেটিক শপ লয়্যালটি পয়েন্ট সিস্টেম</title>
    <style>
        :root {
            --primary-bg: #f8e1e7;
            --primary-color: #d81b60;
            --secondary-color: #880e4f;
            --accent-color: #ff80ab;
            --text-color: #333;
            --white: #ffffff;
            --light-bg: #fff0f5;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        input[type="text"], input[type="number"] {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            flex: 1;
            min-width: 180px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(216, 27, 96, 0.1);
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.1s;
            color: var(--white);
            font-size: 0.95rem;
        }
        button:active {
            transform: scale(0.97);
        }
        .btn-add {
            background-color: var(--primary-color);
        }
        .btn-add:hover {
            background-color: var(--secondary-color);
        }
        .btn-action {
            background-color: var(--accent-color);
            color: var(--secondary-color);
            padding: 6px 12px;
            font-size: 0.85em;
            margin: 2px;
            border-radius: 5px;
            font-weight: 600;
        }
        .btn-action:hover {
            background-color: #ff4081;
            color: var(--white);
        }
        .btn-danger {
            background-color: #e53935;
            color: var(--white);
        }
        .btn-danger:hover {
            background-color: #b71c1c;
        }
        .btn-export {
            background-color: #2196f3;
        }
        .btn-export:hover {
            background-color: #1976d2;
        }
        .btn-import {
            background-color: #4caf50;
        }
        .btn-import:hover {
            background-color: #388e3c;
        }
        .top-actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .top-actions > div {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: var(--light-bg);
            color: var(--secondary-color);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background-color: #fff8fa;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .actions-cell {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .empty-message {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-style: italic;
        }
        .points-display {
            font-weight: 700;
            color: var(--secondary-color);
        }
        #import-file {
            display: none;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 1.4rem;
            }
            th, td {
                padding: 10px 8px;
                font-size: 0.85rem;
            }
            .btn-action {
                padding: 5px 8px;
                font-size: 0.75em;
            }
            .top-actions > div {
                width: 100%;
            }
            .top-actions button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎀 কসমেটিক শপ লয়্যালটি পয়েন্ট 🎀</h1>

        <!-- Add Customer Form -->
        <div class="form-group">
            <input type="text" id="cust-name" placeholder="গ্রাহকের নাম">
            <input type="text" id="cust-phone" placeholder="ফোন নম্বর">
            <input type="number" id="cust-points" placeholder="পয়েন্ট" min="0">
            <button class="btn-add" onclick="addCustomer()">গ্রাহক যোগ করুন</button>
        </div>

        <!-- Data Tools -->
        <div class="top-actions">
            <div>
                <button class="btn-export" onclick="exportData()">📤 এক্সপোর্ট ডেটা (JSON)</button>
                <button class="btn-import" onclick="document.getElementById('import-file').click()">📥 ইমপোর্ট ডেটা (JSON)</button>
                <input type="file" id="import-file" accept=".json" onchange="importData(event)">
            </div>
        </div>

        <!-- Customer Table -->
        <table>
            <thead>
                <tr>
                    <th>নাম</th>
                    <th>ফোন নম্বর</th>
                    <th>বর্তমান পয়েন্ট</th>
                    <th>অ্যাকশন</th>
                </tr>
            </thead>
            <tbody id="customer-table">
                <!-- গ্রাহকের ডেটা এখানে দেখা যাবে -->
            </tbody>
        </table>
    </div>

    <script>
        // ---------- STATE ----------
        let customers = [];

        // ---------- LOAD DATA ----------
        function loadCustomers() {
            try {
                const stored = localStorage.getItem('cosmeticsCustomers');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed)) {
                        customers = parsed;
                    } else {
                        customers = [];
                    }
                } else {
                    customers = [];
                }
            } catch (error) {
                console.error('ডেটা লোড করতে সমস্যা:', error);
                customers = [];
            }
        }

        // ---------- SAVE DATA ----------
        function saveCustomers() {
            try {
                localStorage.setItem('cosmeticsCustomers', JSON.stringify(customers));
            } catch (error) {
                console.error('ডেটা সেভ করতে সমস্যা:', error);
                alert('ডেটা সেভ করতে সমস্যা হয়েছে!');
            }
        }

        // ---------- RENDER TABLE ----------
        function updateTable() {
            const tableBody = document.getElementById('customer-table');
            tableBody.innerHTML = '';

            if (customers.length === 0) {
                const emptyRow = document.createElement('tr');
                emptyRow.innerHTML = '<td colspan="4" class="empty-message">কোন গ্রাহক নেই। নতুন গ্রাহক যোগ করুন।</td>';
                tableBody.appendChild(emptyRow);
                saveCustomers();
                return;
            }

            customers.forEach((customer, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${escapeHtml(customer.name)}</td>
                    <td>${escapeHtml(customer.phone)}</td>
                    <td class="points-display">${customer.points}</td>
                    <td class="actions-cell">
                        <button class="btn-action" onclick="addPointsPrompt(${index})">➕ পয়েন্ট যোগ</button>
                        <button class="btn-action" onclick="deductPointsPrompt(${index})">➖ পয়েন্ট ডিডাক্ট</button>
                        <button class="btn-danger btn-action" onclick="deleteCustomer(${index})">🗑️ ডিলিট</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            saveCustomers();
        }

        // ---------- ESCAPE HTML (XSS protection) ----------
        function escapeHtml(text) {
            if (!text && text !== 0) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        // ---------- ADD CUSTOMER ----------
        function addCustomer() {
            const nameInput = document.getElementById('cust-name');
            const phoneInput = document.getElementById('cust-phone');
            const pointsInput = document.getElementById('cust-points');

            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const points = parseInt(pointsInput.value) || 0;

            if (!name || !phone) {
                alert('অনুগ্রহ করে নাম এবং ফোন নম্বর লিখুন।');
                return;
            }

            if (points < 0) {
                alert('পয়েন্ট ঋণাত্মক হতে পারে না।');
                return;
            }

            // Check for duplicate phone number
            const existingIndex = customers.findIndex(c => c.phone === phone);
            if (existingIndex !== -1) {
                const confirmUpdate = confirm(`এই ফোন নম্বর (${phone}) ইতিমধ্যে ${customers[existingIndex].name} নামে নিবন্ধিত।\nআপনি কি পয়েন্ট যোগ করতে চান?`);
                if (confirmUpdate) {
                    customers[existingIndex].points += points;
                    updateTable();
                    nameInput.value = '';
                    phoneInput.value = '';
                    pointsInput.value = '';
                }
                return;
            }

            const newCustomer = {
                name: name,
                phone: phone,
                points: points
            };

            customers.push(newCustomer);
            nameInput.value = '';
            phoneInput.value = '';
            pointsInput.value = '';
            updateTable();
        }

        // ---------- ADD POINTS ----------
        function addPointsPrompt(index) {
            if (index < 0 || index >= customers.length) return;

            const customer = customers[index];
            const pointsToAdd = prompt(`${customer.name} (${customer.phone}) কে কত পয়েন্ট যোগ করতে চান?`, '10');

            if (pointsToAdd === null) return; // Cancelled

            const trimmed = pointsToAdd.trim();
            if (trimmed === '' || isNaN(trimmed)) {
                alert('অনুগ্রহ করে একটি বৈধ সংখ্যা লিখুন।');
                return;
            }

            const points = parseInt(trimmed);
            if (points <= 0) {
                alert('পয়েন্ট ধনাত্মক হতে হবে।');
                return;
            }

            customers[index].points += points;
            updateTable();
        }

        // ---------- DEDUCT POINTS ----------
        function deductPointsPrompt(index) {
            if (index < 0 || index >= customers.length) return;

            const customer = customers[index];
            const pointsToDeduct = prompt(`${customer.name} (${customer.phone}) থেকে কত পয়েন্ট ডিডাক্ট করতে চান?\nবর্তমান পয়েন্ট: ${customer.points}`, '10');

            if (pointsToDeduct === null) return; // Cancelled

            const trimmed = pointsToDeduct.trim();
            if (trimmed === '' || isNaN(trimmed)) {
                alert('অনুগ্রহ করে একটি বৈধ সংখ্যা লিখুন।');
                return;
            }

            const points = parseInt(trimmed);
            if (points <= 0) {
                alert('পয়েন্ট ধনাত্মক হতে হবে।');
                return;
            }

            if (customers[index].points >= points) {
                customers[index].points -= points;
                updateTable();
            } else {
                alert(`পর্যাপ্ত পয়েন্ট নেই! বর্তমান পয়েন্ট: ${customers[index].points}`);
            }
        }

        // ---------- DELETE CUSTOMER ----------
        function deleteCustomer(index) {
            if (index < 0 || index >= customers.length) return;

            const customer = customers[index];
            if (confirm(`আপনি কি নিশ্চিত যে "${customer.name}" (${customer.phone}) কে ডিলিট করতে চান?`)) {
                customers.splice(index, 1);
                updateTable();
            }
        }

        // ---------- EXPORT DATA ----------
        function exportData() {
            if (customers.length === 0) {
                alert('এক্সপোর্ট করার জন্য কোন ডেটা নেই।');
                return;
            }

            try {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(customers, null, 2));
                const downloadAnchorNode = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", `customer_loyalty_data_${timestamp}.json`);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            } catch (error) {
                console.error('এক্সপোর্ট সমস্যা:', error);
                alert('ডেটা এক্সপোর্ট করতে সমস্যা হয়েছে!');
            }
        }

        // ---------- IMPORT DATA ----------
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);

                    if (!Array.isArray(importedData)) {
                        alert("ভুল ফাইল ফরম্যাট! একটি JSON অ্যারে প্রত্যাশিত।");
                        return;
                    }

                    // Validate each item
                    const validData = [];
                    let invalidCount = 0;

                    for (const item of importedData) {
                        if (item && typeof item === 'object' &&
                            typeof item.name === 'string' &&
                            typeof item.phone === 'string' &&
                            typeof item.points === 'number' &&
                            !isNaN(item.points) && item.points >= 0) {
                            validData.push({
                                name: item.name.trim(),
                                phone: item.phone.trim(),
                                points: Math.floor(item.points)
                            });
                        } else {
                            invalidCount++;
                        }
                    }

                    if (validData.length === 0) {
                        alert("ফাইলে কোন বৈধ গ্রাহক ডেটা পাওয়া যায়নি!");
                        return;
                    }

                    const confirmImport = confirm(
                        `${validData.length} টি গ্রাহক রেকর্ড ইমপোর্ট করা হবে।\n` +
                        `এটি বর্তমান ${customers.length} টি রেকর্ড প্রতিস্থাপন করবে।\n` +
                        (invalidCount > 0 ? `\n(${invalidCount} টি অবৈধ এন্ট্রি বাদ দেওয়া হয়েছে)` : '') +
                        `\n\nআপনি কি চালিয়ে যেতে চান?`
                    );

                    if (!confirmImport) {
                        event.target.value = '';
                        return;
                    }

                    customers = validData;
                    updateTable();
                    alert(`✅ ${validData.length} টি রেকর্ড সফলভাবে ইমপোর্ট হয়েছে!`);

                } catch (error) {
                    console.error('ইমপোর্ট সমস্যা:', error);
                    alert("JSON ফাইল পার্স করতে সমস্যা হয়েছে! ফাইলটি বৈধ কিনা তা পরীক্ষা করুন।");
                } finally {
                    event.target.value = '';
                }
            };

            reader.onerror = function() {
                alert("ফাইল পড়তে সমস্যা হয়েছে!");
                event.target.value = '';
            };

            reader.readAsText(file);
        }

        // ---------- INITIALIZE ----------
        loadCustomers();
        updateTable();
    </script>
</body>
</html>
